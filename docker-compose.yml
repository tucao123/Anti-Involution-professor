# 职引者 ZHIYIN · Phase 2 部署编排
#
# 启动前：把 .env.example 复制为 .env，按需填写 QWEN_/QDRANT_/POSTGRES_/NEO4J_ 项。
#   cp .env.example .env        (Git Bash)   /   copy .env.example .env  (CMD)
# ⚠ 不要挂载个人桌面上的 key.env：容器只能读取显式写进 .env / 环境变量的凭据。
#
# 常用命令：
#   docker compose up -d                               # api + web + 三库
#   docker compose --profile celery up -d              # 追加独立 worker
#   docker compose --profile monitoring up -d          # 追加 Prometheus / Grafana
#   docker compose --profile all up -d                 # 全部
#
# 端口一律只映射到 127.0.0.1，不对外暴露。
# Qdrant 使用用户已有的 Cloud 实例（endpoint + api key 由 .env 注入），
# 因此默认不起本地 qdrant；离线开发可用 --profile local-qdrant。

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "server.py", "--host", "0.0.0.0", "--port", "8848"]
    environment: &api-env
      ZHIYIN_HOST: 0.0.0.0
      LLM_PROVIDER: qwen
      LLM_ENABLED: ${LLM_ENABLED:-false}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      QWEN_MODEL: ${QWEN_MODEL:-qwen-plus}
      QDRANT_URL: ${QDRANT_URL:-}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-zhiyin_public_d}
      QDRANT_ALLOW_WRITE: ${QDRANT_ALLOW_WRITE:-false}
      EMBED_BACKEND: ${EMBED_BACKEND:-auto}
      ALLOW_CLOUD_FOR_USER_DATA: ${ALLOW_CLOUD_FOR_USER_DATA:-false}
      ALLOW_PUBLIC_SAMPLE_TO_CLOUD: ${ALLOW_PUBLIC_SAMPLE_TO_CLOUD:-true}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-zhiyin}
      POSTGRES_USER: ${POSTGRES_USER:-zhiyin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zhiyin_local}
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-zhiyin_local}
      CELERY_TASK_ALWAYS_EAGER: ${CELERY_TASK_ALWAYS_EAGER:-false}
      METRICS_ENABLED: "true"
    ports:
      - "127.0.0.1:8848:8848"
    volumes:
      - privacy-data:/app/.privacy
      - rag-data:/app/.rag
      - stores-data:/app/.stores
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      ZHIYIN_BFF_URL: http://api:8848
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zhiyin}
      POSTGRES_USER: ${POSTGRES_USER:-zhiyin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zhiyin_local}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./deploy/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zhiyin} -d ${POSTGRES_DB:-zhiyin}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-zhiyin_local}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
    volumes:
      - neo4j-data:/data
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    restart: unless-stopped

  worker:
    profiles: ["celery", "all"]
    build:
      context: .
      dockerfile: Dockerfile
    command: ["celery", "-A", "celery_worker:app", "worker", "--loglevel=info", "--concurrency=2"]
    environment: *api-env
    depends_on:
      redis: { condition: service_healthy }
      api: { condition: service_started }
    restart: unless-stopped

  prometheus:
    profiles: ["monitoring", "all"]
    image: prom/prometheus:v2.55.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prom-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    profiles: ["monitoring", "all"]
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-zhiyin_local}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  # 可选：完全离线的本地向量库（默认使用用户已有的 Qdrant Cloud）
  qdrant-local:
    profiles: ["local-qdrant"]
    image: qdrant/qdrant:v1.12.1
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"

volumes:
  privacy-data:
  rag-data:
  stores-data:
  pg-data:
  redis-data:
  neo4j-data:
  prom-data:
  grafana-data:
  qdrant-data:
